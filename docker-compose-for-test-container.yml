version: '3.8'

services:
  jobprep_test_mysql:
    image: mysql:8.2.0
    environment:
      MYSQL_ROOT_PASSWORD: rootPassword
      MYSQL_DATABASE: jobprep-mysql-test
      MYSQL_USER: testUser
      MYSQL_PASSWORD: testPassword
    ports:
      - "3309:3306"
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u root -prootPassword || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - db_test_data:/var/lib/mysql
      - db_test_log:/var/log/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d
      - ./src/test/resources/test_container/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - test_network

  init_permission:
    image: nginx:latest
    ports:
      - "3015:80"
    volumes:
      - ./docker/mongo/etc:/key
    healthcheck:
      test: [ "CMD", "sh", "-c", "sleep 2 && [ -f /key/mongodb.key ] || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3

  jobprep_test_mongo:
    image: mongo:6.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: 1234
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--keyFile", "/etc/mongodb.key", "--bind_ip_all"]
    depends_on:
      init_permission:
        condition: service_healthy
    healthcheck:
      test: >
        test $$(mongosh --port 27017 --quiet --eval "try {
           var status = rs.status();
           status.ok
         } catch (e) {
           if (e.codeName == 'NotYetInitialized') {
             rs.initiate({
               _id: \"rs0\",
              members: [
                { _id: 0, host: \"jobprep_test_mongo:27017\" },
                { _id: 1, host: \"mongo_test_secondary_01:27017\" },
                { _id: 2, host: \"mongo_test_secondary_02:27017\" }
              ]
             }).ok
           }
         }" -u admin -p 1234 --authenticationDatabase admin) -eq 1
      interval: 20s
      timeout: 10s
      retries: 6
    volumes:
      - mongodb_test_data:/data/db
      - ./docker/mongo/etc/mongodb.key:/etc/mongodb.key
      - ./docker/mongo/test/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - test_network

  mongo_test_secondary_01:
    image: mongo:6.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: 1234
    ports:
      - "27018:27018"
    command: ["--replSet", "rs0", "--keyFile", "/etc/mongodb.key", "--bind_ip_all"]
    depends_on:
      init_permission:
        condition: service_healthy
    volumes:
      - mongodb_test_secondary_01_data:/data/db
      - ./docker/mongo/etc/mongodb.key:/etc/mongodb.key
    networks:
      - test_network

  mongo_test_secondary_02:
    image: mongo:6.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: 1234
    ports:
      - "27019:27019"
    command: ["--replSet", "rs0", "--keyFile", "/etc/mongodb.key", "--bind_ip_all"]
    depends_on:
      init_permission:
        condition: service_healthy
    volumes:
      - mongodb_test_secondary_02_data:/data/db
      - ./docker/mongo/etc/mongodb.key:/etc/mongodb.key
    networks:
      - test_network

  jobprep_test_redis:
    image: redis:6.2.6-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_test_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - test_network

  monitor:
    image: alpine:latest
    depends_on:
      jobprep_test_mysql:
        condition: service_healthy
      jobprep_test_mongo:
        condition: service_healthy
      mongo_test_secondary_01:
        condition: service_started
      mongo_test_secondary_02:
        condition: service_started
      jobprep_test_redis:
        condition: service_started
    command: sh -c "echo '🔥All of Database Service are healthy!' && tail -f /dev/null"
    networks:
      - test_network

volumes:
  db_test_data: {}
  db_test_log: {}
  db_test_cnf: {}
  mongodb_test_data: {}
  mongodb_test_secondary_01_data: {}
  mongodb_test_secondary_02_data: {}
  redis_test_data: {}

networks:
  test_network:
    driver: bridge